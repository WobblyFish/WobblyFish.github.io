<!DOCTYPE html><html lang="en">
<head>
    <title>404 Not Found | WEBSITE NAME</title>
</head>
<body>
    <h1 id="hdr">404</h1>
    <h2 id="subhdr">Page not found</h2>
    <style>
        body {
            background-color: #FFFFFF;
        }
        #hdr {
            width: 100%;
            font-size: 8em;
            font-family: Arial;
            font-weight: bold;
            text-align: center;
            color: #000000;
            margin: 0px;
            padding: 0px;
            position: absolute;
            top: calc(40% - 92px);
            left: 0px;
        }
        #subhdr {
            width: 100%;
            font-size: 2em;
            font-family: Arial;
            font-weight: normal;
            text-align: center;
            font-style: italic;
            color: #000000;
            margin: 0px;
            padding: 0px;
            position: absolute;
            top: calc(40% + 56px);
            left: 0px;
        }
    </style>
</body>
</html>
