<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
	<title>English &lt;&gt; Dutch</title>
	<meta name="description" content="" />
</head>
<body>
	<h1 id="word">[WORD]</h1>
	<h6 id="part">[PART OF SPEECH]</h6>
	<label id="label_1"><span id="label_span_1">Infinitive:</span> <input id="text_1" type="text" autocomplete="off" autocorrect="off" correct="tbd" /></label>
	<label id="label_2"><span id="label_span_2">Past&nbsp;Tense:</span> <input id="text_2" type="text" autocomplete="off" autocorrect="off" correct="tbd" /></label>
	<label id="label_3"><span id="label_span_3">Past&nbsp;Participle:</span> <input id="text_3" type="text" autocomplete="off" autocorrect="off" correct="tbd" /></label>
	<button id="submit" onclick="submit()">CHECK</button>
	<style>
		body {
			font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
			letter-spacing: 1px;
			margin: 0;
		}
		#word {
			width: 100%;
			font-size: 24pt;
			text-align: center;
			position: fixed;
			top: calc(50% - 220px);
		}
		#part {
			width: 100%;
			font-size: 10pt;
			text-align: center;
			position: fixed;
			top: calc(50% - 140px);
		}
		label {
			display: flex;
			width: 100vw;
			box-sizing: border-box;
			font-size: 12pt;
			padding: 0 25px;
			position: fixed;
			left: 0;
		}
		#label_1 {
			top: calc(50% - 40px);
		}
		#label_2 {
			top: calc(50% + 30px);
		}
		#label_3 {
			top: calc(50% + 100px);
		}
		label span {
			padding: 0 5px 0 0;
			color: #A0A0A0;
		}
		input {
			width: 100%;
			outline: none;
			font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
			font-size: 12pt;
			padding: 5px 6px;
			border-top: none;
			border-right: none;
			border-bottom: 1px solid #000000;
			border-left: none;
			box-sizing: border-box;
			position: relative;
			top: -5px;
		}
		input:focus {
			border-bottom: 2px solid #000000;
		}
		input[correct="no"] {
			background-color: #FFDADA;
			color: #760E0E;
		}
		#submit {
			width: 160px;
			outline: none;
			background-color: #173590;
			color: #FFFFFF;
			border: 2px solid #0E3555;
			border-radius: 15px;
			font-size: 24pt;
			padding: 10px 0;
			cursor: pointer;
			position: fixed;
			top: calc(50% + 200px);
			left: calc(50% - 80px);
		}
		@media screen and (width >= 700px) {
			label {
				width: 700px;
				font-size: 16pt;
				left: calc(50% - 350px);
			}
			label span {
				padding: 0 10px 0 0;
			}
			input {
				font-size: 16pt;
			}
		}
		@media screen and (height >= 850px) {
			#word {
				font-size: 48pt;
				top: calc(50% - 280px);
			}
			#part {
				font-size: 12pt;
				top: calc(50% - 170px);
			}
		}
	</style>
	<script>
		const id_word = document.getElementById("word");
		const id_part = document.getElementById("part");
		const id_label_1 = document.getElementById("label_1");
		const id_label_2 = document.getElementById("label_2");
		const id_label_3 = document.getElementById("label_3");
		const id_label_span_1 = document.getElementById("label_span_1");
		const id_label_span_2 = document.getElementById("label_span_2");
		const id_label_span_3 = document.getElementById("label_span_3");
		const id_text_1 = document.getElementById("text_1");
		const id_text_2 = document.getElementById("text_2");
		const id_text_3 = document.getElementById("text_3");

		const en_nl_words = [
			{ part: "phrase", en: "\"Better safe than sorry\"", phrase: "Hey zekere voor het onzekere", correct: 0, incorrect: 0 },
			{ part: "noun", en: "the syllable", si: "de lettergreep", pl: "lettergrepen", correct: 0, incorrect: 0 },
			{ part: "noun", en: "the debt", si: "de schuld", pl: "schulden", correct: 0, incorrect: 0 },
			{ part: "noun", en: "the gnome", si: "de kabouter", pl: "kabouters", correct: 0, incorrect: 0 },
			{ part: "indefinite pronoun", en: "sufficient; enough; plenty of", std: "voldoende", correct: 0, incorrect: 0 },
			{ part: "verb", en: "to launch", inf: "lanceren", pt: "lanceerde", pp: "gelanceerd", correct: 0, incorrect: 0 },
			{ part: "verb", en: "to whine", inf: "zeiken", pt: "zeikte", pp: "gezeikt", correct: 0, incorrect: 0 },
			{ part: "verb", en: "to urinate; pee", inf: "zeiken", pt: "zeikte", pp: "gezeikt", correct: 0, incorrect: 0 },
			{ part: "verb", en: "to pour (rain)", inf: "zeiken", pt: "zeikte", pp: "gezeikt", correct: 0, incorrect: 0 },
			{ part: "verb", en: "to destroy", inf: "vernielen", pt: "vernielde", pp: "vernield", correct: 0, incorrect: 0 },
			{ part: "adjective", en: "(het) strong", std: "sterk", comp: "sterker", super: "sterkst", correct: 0, incorrect: 0 },
			{ part: "adjective", en: "(de) strong", std: "sterke", comp: "sterkere", super: "sterkste", correct: 0, incorrect: 0 },
		];

		var wordIndex = 0;
		function loadWord() {
			while (en_nl_words.length > 1) {
				var tempWordIndex = Math.floor(Math.random() * en_nl_words.length);
				if (tempWordIndex != wordIndex) {
					wordIndex = tempWordIndex;
					break;
				}
			}
			id_word.innerHTML = en_nl_words[wordIndex].en;
			id_part.innerHTML = en_nl_words[wordIndex].part.toUpperCase();
			id_text_1.value = "";
			id_text_1.setAttribute("correct", "tbd");
			id_text_2.value = "";
			id_text_2.setAttribute("correct", "tbd");
			id_text_3.value = "";
			id_text_3.setAttribute("correct", "tbd");
			if (en_nl_words[wordIndex].part == "phrase") {
				id_label_span_1.innerHTML = "Phrase:";
				id_label_2.style.display = "none";
				id_label_3.style.display = "none";
			}
			else if (en_nl_words[wordIndex].part == "noun") {
				id_label_span_1.innerHTML = "Singular:";
				id_label_2.style.display = "flex";
				id_label_span_2.innerHTML = "Plural:";
				id_label_3.style.display = "none";
			}
			else if (en_nl_words[wordIndex].part == "indefinite pronoun") {
				id_label_span_1.innerHTML = "Stated:";
				id_label_2.style.display = "none";
				id_label_3.style.display = "none";
			}
			else if (en_nl_words[wordIndex].part == "verb") {
				id_label_span_1.innerHTML = "Infinitive:";
				id_label_2.style.display = "flex";
				id_label_span_2.innerHTML = "Past&nbsp;Tense:";
				id_label_3.style.display = "flex";
				id_label_span_3.innerHTML = "Past&nbsp;Participle:";
			}
			else if (en_nl_words[wordIndex].part == "adjective") {
				id_label_span_1.innerHTML = "Stated:";
				id_label_2.style.display = "flex";
				id_label_span_2.innerHTML = "Comparative:";
				id_label_3.style.display = "flex";
				id_label_span_3.innerHTML = "Superlative:";
			}
			else {
				console.log("ERROR [1]: loadWord()");
			}
		}
		loadWord();

		function submit() {
			if (en_nl_words[wordIndex].part == "phrase") {
				if (id_text_1.value == en_nl_words[wordIndex].phrase) {
					en_nl_words[wordIndex].correct++;
					loadWord();
				}
				else {
					en_nl_words[wordIndex].incorrect++;
					id_text_1.setAttribute("correct", "no");
				}
			}
			else if (en_nl_words[wordIndex].part == "noun") {
				if (
					id_text_1.value == en_nl_words[wordIndex].si &&
					id_text_2.value == en_nl_words[wordIndex].pl
				) {
					en_nl_words[wordIndex].correct++;
					loadWord();
				}
				else {
					en_nl_words[wordIndex].incorrect++;
					id_text_1.setAttribute("correct", (id_text_1.value == en_nl_words[wordIndex].si ? "yes" : "no"));
					id_text_2.setAttribute("correct", (id_text_2.value == en_nl_words[wordIndex].pl ? "yes" : "no"));
				}
			}
			else if (en_nl_words[wordIndex].part == "indefinite pronoun") {
				if (id_text_1.value == en_nl_words[wordIndex].std) {
					en_nl_words[wordIndex].correct++;
					loadWord();
				}
				else {
					en_nl_words[wordIndex].incorrect++;
					id_text_1.setAttribute("correct", "no");
				}
			}
			else if (en_nl_words[wordIndex].part == "verb") {
				if (
					id_text_1.value == en_nl_words[wordIndex].inf &&
					id_text_2.value == en_nl_words[wordIndex].pt &&
					id_text_3.value == en_nl_words[wordIndex].pp
				) {
					en_nl_words[wordIndex].correct++;
					loadWord();
				}
				else {
					en_nl_words[wordIndex].incorrect++;
					id_text_1.setAttribute("correct", (id_text_1.value == en_nl_words[wordIndex].inf ? "yes" : "no"));
					id_text_2.setAttribute("correct", (id_text_2.value == en_nl_words[wordIndex].pt ? "yes" : "no"));
					id_text_3.setAttribute("correct", (id_text_3.value == en_nl_words[wordIndex].pp ? "yes" : "no"));
				}
			}
			else if (en_nl_words[wordIndex].part == "adjective") {
				if (
					id_text_1.value == en_nl_words[wordIndex].std &&
					id_text_2.value == en_nl_words[wordIndex].comp &&
					id_text_3.value == en_nl_words[wordIndex].super
				) {
					en_nl_words[wordIndex].correct++;
					loadWord();
				}
				else {
					en_nl_words[wordIndex].incorrect++;
					id_text_1.setAttribute("correct", (id_text_1.value == en_nl_words[wordIndex].std ? "yes" : "no"));
					id_text_2.setAttribute("correct", (id_text_2.value == en_nl_words[wordIndex].comp ? "yes" : "no"));
					id_text_3.setAttribute("correct", (id_text_3.value == en_nl_words[wordIndex].super ? "yes" : "no"));
				}
			}
			else {
				console.log("ERROR [1]: submit()");
			}
		}
	</script>
</body></html>
